# Prefix key: default Ctrl-b
set -g prefix C-b
bind C-b send-prefix

set -g mouse on

setw -g mode-keys vi

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded!"

# iTerm2 tmux integration best practices
set -g default-terminal "xterm-256color"
set-option -g set-titles on
set-option -g set-titles-string "#T"

# Image preview support (yazi in tmux)
# allow-passthrough needs tmux >= 3.3; guard so older servers don't abort source-file
if-shell -b '[ "$(tmux -V | cut -d" " -f2 | tr -dc 0-9.)" \> "3.2" ]' 'set -g allow-passthrough on'
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Lazygit popup: prefix + g
bind g display-popup -d '#{pane_current_path}' -w80% -h80% -E lazygit